                </div>

                </textarea>
                <div class="comment-buttons">
                    <button @click="onSubmit">Leave Public Note</button>
                    <button class="button-sec" @click="onSubmitLocal">Leave Local Note</button>
                </div>
                <div class="comment-loader" x-show="isLoading">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480-880q17 0 28.5 11.5T520-840q0 17-11.5 28.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-17 11.5-28.5T840-520q17 0 28.5 11.5T880-480q0 82-31.5 155t-86 127.5q-54.5 54.5-127 86T480.5-80Q398-80 325-111.5Z"/></svg>
                </div>
            </div>
        </div>
        <div class="detached-comments" x-show="detachedComments && detachedComments.length > 0">
            <h2 class="detached-comments-title">Detached comments (<span x-text="detachedComments.length">0</span>)</h2>
            <div class="detached-comments-list">
                <template x-for="comment in detachedComments">
                    <div class="detached-comments-item">
                        <div class="detached-comments-message" x-html="comment.msg"></div>
                        <div @click="onDelete(comment)" class="detached-comments-delete comment-msg-delete">

                        </div>

    <div id="newMenuMenu" class="newMenu-menuWrapper">
        <div class="newMenu-menuWrapperInner">
            <div class="newMenu-menuSearch">
                <input autocomplete="off" id="newMenuSearch" class="newMenu-search" type="text" placeholder="Search..."/>
            </div>
            <div id="menuItems" class="newMenu-menuItems">
            </div>
        </div>
    </div>

    <div id="newMenuFilter" class="newMenu-menuWrapper isFilter">
        <div class="newMenu-menuWrapperInner isFilter">
            <div id="filterItems" class="newMenu-filterItems">

            </div>
        </div>
    </div>

    <div id="newMenuConfig" class="newMenu-menuWrapper isConfigs" x-init="buildClasses" x-data="{
        configs: [
            {l: 'Show Gallery', c: 'hideGallery'},
            {l: 'Show Shopping Cart', c: 'hideShoppingCart'},
            {l: 'Show WeChat', c: 'hideWeChat'},
            {l: 'Full View', c: 'isCompactView'},
        ],
        cache: false,
        getConfigs: function() {
            if (this.cache) return this.cache;
            this.cache = localStorage.getItem('appConfig');
            if (!this.cache) this.cache = { isCompactView: false };
            else this.cache = JSON.parse(this.cache);
            return this.cache;
        },
        isDisabled: function(key) {
            if (key === 'isCompactView') {
                return this.configs.findIndex((k) => k.c !== 'isCompactView' && this.isDisabled(k.c)) >= 0;
            }
            return !!this.getConfigs()[key];
        },
        toggleAll: function() {
            const isDisabled = this.isDisabled('isCompactView');
            const c = this.getConfigs();
            this.configs.forEach((k) => c[k.c] = !isDisabled);
            localStorage.setItem('appConfig', JSON.stringify(c));
            this.cache = c;
            this.buildClasses();
            console.debug([c]);
        },
        toggle: function(key) {
            if (key === 'isCompactView') {
                return this.toggleAll();
            }
            const c = this.getConfigs();
            c[key] = !c[key];
            localStorage.setItem('appConfig', JSON.stringify(c));
            this.cache = c;
            this.buildClasses();
        },
        buildClasses: function() {
            const c = this.getConfigs();
            Object.keys(c).forEach((k) => {
                document.body.classList.toggle(k, c[k]);
            });
        }
    }">
        <div class="newMenu-menuWrapperInner isConfigs">
            <div id="configItems" class="newMenu-configItems">
                <template x-for="config in configs">
                    <div class="config-item">
                        <div class="config-item-title" x-text="config.l">
                        </div>
                        <div class="config-item-toggle" @click="toggle(config.c)" :class="{ 'isDisabled': isDisabled(config.c) }">
                            <div class="config-item-toggle-bar"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
