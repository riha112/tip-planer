<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Beijing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="theme.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mdbassit/Wysi@latest/dist/wysi.min.css"/>
    <script src="https://cdn.jsdelivr.net/gh/mdbassit/Wysi@latest/dist/wysi.min.js"></script>
    <link rel="manifest" href="./pwx/manifest.json">
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
</head>
<body>

    <div id="App">
        <div id="PlanSelector">

        </div>
        <div id="Plans">
            
        </div>
    </div>

    <div x-data="initComment()" @showCommentForm.window="onShow($event.detail.uid)" x-cloak>
        <div id="Comment" class="comment" @click="onBtnClose" :class="{'isHidden': isHidden}">
            <div class="comment-form">
                <div class="comment-header">
                    <span>Add Note</span>
                    <svg @click="onClose" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </div>
                <textarea id="CommentWysiwyg" class="comment-input-wrapper">
                </textarea>
                <div class="comment-buttons">
                    <button @click="onSubmit">Leave Public Note</button>
                    <button class="button-sec" @click="onSubmitLocal">Leave Local Note</button>
                </div>
                <div class="comment-loader" x-show="isLoading">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480-880q17 0 28.5 11.5T520-840q0 17-11.5 28.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-17 11.5-28.5T840-520q17 0 28.5 11.5T880-480q0 82-31.5 155t-86 127.5q-54.5 54.5-127 86T480.5-80Q398-80 325-111.5Z"/></svg>
                </div>
            </div>
        </div>
        <div class="detached-comments" x-show="detachedComments && detachedComments.length > 0">
            <h2>Detached comments</h2>
            <div class="detached-comment-list">
                <template x-for="comment in detachedComments">
                    <div class="detached-comment">
                        <div class="detached-comment-message" x-text="comment.msg"></div>
                    </div>
                </template>
            </div>
        </div>
    </div>



    <div class="newMenu">
        <div class="comment-mode-notice">
            Use right click to leave comment.
        </div>
        <div id="homeMenu" class="newMenu-item newMenu-home" data-fn="onHome">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
            <div class="newMenu-itemText">Home</div>
        </div>
        <div id="planMenu" class="newMenu-item newMenu-plan isActive" data-fn="onPlan">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h168q13-36 43.5-58t68.5-22q38 0 68.5 22t43.5 58h168q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm80-80h280v-80H280v80Zm0-160h400v-80H280v80Zm0-160h400v-80H280v80Zm221.5-198.5Q510-807 510-820t-8.5-21.5Q493-850 480-850t-21.5 8.5Q450-833 450-820t8.5 21.5Q467-790 480-790t21.5-8.5ZM200-200v-560 560Z"/></svg>
            <div class="newMenu-itemText">Seoul</div>
        </div>
        <div id="menuMenu" class="newMenu-item newMenu-menu" data-toggle="true" data-fn="onMenu">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
            <div class="newMenu-itemText">Menu</div>
        </div>
        <div id="filterMenu" class="newMenu-item newMenu-filter" data-toggle="true" data-fn="onFilter">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Zm0 0Z"/></svg>
            <div class="newMenu-itemText">Filter</div>
        </div>
        <div class="newMenu-item newMenu-comment" data-toggle="true" data-fn="onComments">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-400h320v-80H240v80Zm0-120h480v-80H240v80Zm0-120h480v-80H240v80ZM80-80v-720q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H240L80-80Zm126-240h594v-480H160v525l46-45Zm-46 0v-480 480Z"/></svg>
            <div class="newMenu-itemText">Com/On</div>
        </div>
    </div>

    <div id="newMenuMenu" class="newMenu-menuWrapper">
        <div class="newMenu-menuWrapperInner">
            <div class="newMenu-menuSearch">
                <input autocomplete="off" id="newMenuSearch" class="newMenu-search" type="text" placeholder="Search..."/>
            </div>
            <div id="menuItems" class="newMenu-menuItems">

            </div>
        </div>
    </div>

    <div id="newMenuFilter" class="newMenu-menuWrapper isFilter">
        <div class="newMenu-menuWrapperInner isFilter">
            <div id="filterItems" class="newMenu-filterItems">

            </div>
        </div>
    </div>

    <!-- <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> -->
    <script src="./js/crypt.js"></script>
    <script src="./js/hash.js"></script>
    <script src="./js/pipe.js"></script>
    <script src="./js/wordEffect.js"></script>
    <script src="./js/filters.js"></script>
    
    <script src="./js/data.js"></script>

    <script src="./js/plan.js"></script>
    <script src="./js/plan-enc.js"></script>
    <script src="./js/app.js"></script>

    <script src="./js/comment.js"></script>
    <script src="./js/menu.js"></script>
    <!-- <script src="./map.js"></script> -->
</body>
</html>
